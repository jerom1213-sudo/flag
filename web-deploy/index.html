<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>더 플래그 통합관리</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --line: #dfe4ea;
      --text: #20242a;
      --muted: #68717d;
      --nav: #263238;
      --nav-soft: #32424a;
      --green: #15856f;
      --red: #c7473f;
      --amber: #c47b18;
      --blue: #2c6ca3;
      --violet: #6b5ea8;
      --shadow: 0 10px 28px rgba(20, 31, 40, .08);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Malgun Gothic", Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    button, input, select, textarea { font: inherit; }
    button {
      border: 0;
      border-radius: 6px;
      background: var(--nav);
      color: #fff;
      padding: 9px 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    button.secondary { background: #e8edf1; color: var(--text); }
    button.green { background: var(--green); }
    button.red { background: var(--red); }
    button.amber { background: var(--amber); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      padding: 9px 10px;
      min-height: 39px;
    }
    textarea { min-height: 84px; resize: vertical; }
    label { display: grid; gap: 6px; color: var(--muted); font-size: 13px; }
    h1, h2, h3 { margin: 0; letter-spacing: 0; }
    h1 { font-size: 24px; }
    h2 { font-size: 20px; }
    h3 { font-size: 16px; }
    .app { min-height: 100vh; display: grid; grid-template-columns: 250px 1fr; }
    .sidebar {
      background: var(--nav);
      color: #fff;
      padding: 22px 16px;
      position: sticky;
      top: 0;
      height: 100vh;
    }
    .brand { display: grid; gap: 4px; margin-bottom: 24px; }
    .brand strong { font-size: 20px; }
    .brand span { color: #b8c5cb; font-size: 13px; }
    .user-box {
      padding: 12px;
      border-radius: 8px;
      background: var(--nav-soft);
      margin-bottom: 18px;
      display: grid;
      gap: 6px;
      font-size: 13px;
    }
    .nav { display: grid; gap: 6px; }
    .nav button {
      text-align: left;
      background: transparent;
      color: #d9e4e8;
      border-radius: 6px;
      padding: 11px 12px;
    }
    .nav button.active, .nav button:hover { background: #405158; color: #fff; }
    .main { padding: 24px; display: grid; gap: 18px; align-content: start; }
    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
    }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 16px;
    }
    .grid { display: grid; gap: 12px; }
    .cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .summary { grid-template-columns: repeat(5, minmax(140px, 1fr)); }
    .stat {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      display: grid;
      gap: 8px;
      min-height: 92px;
    }
    .stat span { color: var(--muted); font-size: 13px; }
    .stat strong { font-size: 26px; }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
    .tabs button { background: #e8edf1; color: var(--text); }
    .tabs button.active { background: var(--blue); color: #fff; }
    .table-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
    .table-wrap.status-table {
      max-height: 470px;
      min-height: 470px;
      overflow: auto;
    }
    .table-wrap.status-table th,
    .table-wrap.status-table td {
      white-space: nowrap;
      height: 42px;
      vertical-align: middle;
    }
    table { width: 100%; border-collapse: collapse; min-width: 860px; background: #fff; }
    th, td { padding: 10px 11px; border-bottom: 1px solid var(--line); text-align: left; font-size: 13px; vertical-align: top; }
    th { background: #edf1f4; color: #3a424a; position: sticky; top: 0; z-index: 1; cursor: pointer; user-select: none; }
    th.filter-active { background: #d9e9f7; color: #1f5e8e; }
    tr:hover td { background: #fafcfd; }
    .driver-order-detail {
      display: grid;
      gap: 4px;
      min-width: 180px;
      line-height: 1.45;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border-radius: 999px;
      padding: 2px 9px;
      font-size: 12px;
      font-weight: 700;
      background: #edf1f4;
      color: #3c4852;
    }
    .badge.green { background: #dff4ee; color: #0b6c57; }
    .badge.red { background: #ffe4e0; color: #ad352d; }
    .badge.amber { background: #fff0d4; color: #925807; }
    .badge.blue { background: #e0eef9; color: #225a87; }
    .badge.violet { background: #eae7f8; color: #51458f; }
    .chart-row { display: grid; grid-template-columns: 120px 1fr 42px; gap: 10px; align-items: center; }
    .bar { height: 12px; background: #e6ebef; border-radius: 999px; overflow: hidden; }
    .bar > i { display: block; height: 100%; background: var(--green); border-radius: 999px; }
    .login {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(135deg, #eef4f6, #f7f2e8);
    }
    .login-card {
      width: min(980px, 100%);
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      overflow: hidden;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: var(--shadow);
    }
    .login-visual {
      padding: 38px;
      background:
        linear-gradient(rgba(28, 42, 48, .80), rgba(28, 42, 48, .70)),
        url("https://images.unsplash.com/photo-1521791136064-7986c2920216?auto=format&fit=crop&w=1200&q=75");
      background-size: cover;
      color: #fff;
      display: grid;
      align-content: end;
      min-height: 480px;
    }
    .login-form { padding: 34px; display: grid; gap: 14px; align-content: center; }
    .hint { color: var(--muted); font-size: 13px; line-height: 1.5; }
    .role-select {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }
    .role-option {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      padding: 12px 8px;
      display: grid;
      gap: 5px;
      text-align: center;
    }
    .role-option.active {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
    }
    .role-option span {
      color: inherit;
      opacity: .78;
      font-size: 12px;
    }
    .login-error {
      display: none;
      color: var(--red);
      background: #ffecea;
      border: 1px solid #ffc8c2;
      border-radius: 6px;
      padding: 9px 10px;
      font-size: 13px;
    }
    .login-error.show { display: block; }
    .client-form-box {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      background: #fffdfa;
      display: grid;
      gap: 12px;
      font-size: 19.5px;
    }
    .client-form-box h3 {
      font-size: 24px;
    }
    .client-form-box label,
    .client-form-box input,
    .client-form-box select,
    .client-form-box textarea,
    .client-form-box button,
    .client-form-box th,
    .client-form-box td {
      font-size: 19.5px;
    }
    .client-form-box .badge,
    .client-form-box .photo-list span {
      font-size: 18px;
    }
    .admin-management {
      font-size: 19.5px;
    }
    .admin-management h3 {
      font-size: 24px;
    }
    .admin-management label,
    .admin-management input,
    .admin-management select,
    .admin-management textarea,
    .admin-management button,
    .admin-management th,
    .admin-management td {
      font-size: 19.5px;
    }
    .admin-management .badge,
    .admin-management .photo-list span {
      font-size: 18px;
    }
    .order-input-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      align-items: start;
      font-size: 19.5px;
    }
    .order-input-layout form.client-form-box {
      padding: 14px;
      gap: 10px;
    }
    .order-input-layout h3 {
      font-size: 24px;
    }
    .order-input-layout label,
    .order-input-layout input,
    .order-input-layout select,
    .order-input-layout textarea,
    .order-input-layout button,
    .order-input-layout th,
    .order-input-layout td {
      font-size: 19.5px;
    }
    .order-input-layout .badge {
      font-size: 18px;
    }
    .order-assign-board {
      display: grid;
      grid-template-rows: minmax(0, 1fr) minmax(0, 1fr) minmax(220px, .75fr);
      gap: 12px;
      height: calc(100vh - 220px);
      min-height: 900px;
    }
    .order-assign-board .client-form-box {
      min-height: 0;
      overflow: hidden;
      grid-template-rows: auto minmax(0, 1fr);
    }
    .order-assign-board .table-wrap.status-table {
      height: 100%;
      min-height: 0;
      max-height: none;
    }
    .order-assign-board table {
      min-width: 2200px;
    }
    .order-assign-board tr.selected td {
      font-weight: 800;
      background: #f7fbef;
    }
    .flag-location-table table {
      min-width: 1180px;
    }
    .order-assign-action {
      display: grid;
      grid-template-columns: minmax(150px, 1fr) auto;
      gap: 6px;
      align-items: center;
    }
    .order-assign-action select,
    .order-assign-action button {
      min-height: 32px;
      padding: 5px 8px;
      font-size: 14px;
    }
    .order-input-layout .table-wrap {
      max-height: 420px;
      overflow: auto;
    }
    .order-input-status .table-wrap {
      max-height: 470px;
      min-height: 470px;
      overflow: auto;
    }
    .order-input-status table {
      min-width: 1820px;
    }
    .order-input-status th,
    .order-input-status td {
      white-space: nowrap;
      height: 42px;
      vertical-align: middle;
    }
    .order-input-layout textarea {
      min-height: 39px;
      height: 39px;
    }
    .order-input-layout .status-select button {
      min-height: 40px;
    }
    .order-meta-row {
      display: grid;
      grid-template-columns: minmax(180px, .45fr) minmax(280px, 1fr);
      gap: 10px;
      align-items: end;
    }
    .order-meta-field {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 8px;
      align-items: center;
      color: var(--muted);
      font-size: 19.5px;
    }
    .order-subject-value {
      min-height: 39px;
      display: flex;
      align-items: center;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #f8fafb;
      color: var(--text);
      font-size: 19.5px;
    }
    .status-select {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }
    .status-select button {
      background: #fff;
      color: var(--text);
      border: 1px solid var(--line);
      min-height: 46px;
    }
    .status-select button.active {
      border-color: var(--amber);
      background: #fff6e6;
      color: #6f4608;
    }
    .form-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .form-row.inline-fields label {
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 8px;
    }
    .form-row.inline-fields label > span {
      white-space: nowrap;
    }
    .single-line-field {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 8px;
      align-items: center;
    }
    .single-line-field > span {
      white-space: nowrap;
    }
    .burial-parts {
      display: grid;
      grid-template-columns: 1.3fr .85fr .85fr;
      gap: 8px;
    }
    .datetime-parts {
      display: grid;
      grid-template-columns: 1.3fr .85fr .85fr;
      gap: 8px;
    }
    .manual-venue-fields {
      grid-column: 1 / -1;
      display: none;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }
    .client-mobile-order {
      width: min(720px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 12px;
    }
    .client-mobile-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 14px;
      display: grid;
      gap: 12px;
    }
    .client-mobile-card h3 {
      font-size: 18px;
      line-height: 1.3;
    }
    .client-mobile-card label,
    .client-mobile-card input,
    .client-mobile-card select,
    .client-mobile-card textarea,
    .client-mobile-card button {
      font-size: 15px;
    }
    .client-mobile-card label {
      color: var(--muted);
    }
    .client-mobile-card .status-select {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .client-mobile-card .status-select button {
      min-height: 44px;
      padding: 8px 6px;
      white-space: normal;
    }
    .client-mobile-card .form-row,
    .client-mobile-card .order-meta-row,
    .client-mobile-card .manual-venue-fields {
      grid-template-columns: 1fr;
    }
    .client-mobile-card .form-row.inline-fields label,
    .client-mobile-card .single-line-field {
      grid-template-columns: 1fr;
    }
    .client-mobile-card .burial-parts,
    .client-mobile-card .datetime-parts {
      grid-template-columns: minmax(0, 1.5fr) minmax(72px, .75fr) minmax(72px, .75fr);
    }
    .client-mobile-card textarea {
      min-height: 78px;
    }
    .client-mobile-submit {
      min-height: 48px;
      font-weight: 800;
    }
    .client-order-card-list {
      display: grid;
      gap: 8px;
    }
    .client-order-item {
      width: 100%;
      text-align: left;
      background: #fff;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      white-space: normal;
      display: grid;
      gap: 6px;
    }
    .client-order-item strong,
    .client-order-item span {
      overflow-wrap: anywhere;
      word-break: keep-all;
    }
    .client-order-item small {
      color: var(--muted);
      line-height: 1.45;
    }
    .rate-input-table table {
      min-width: 760px;
      border: 1px solid #1b1b1b;
    }
    .rate-input-table th {
      background: #06ad52;
      color: #061d0f;
      text-align: center;
      border: 1px solid #1b1b1b;
    }
    .rate-input-table td {
      border: 1px solid #1b1b1b;
      height: 30px;
      padding: 2px 6px;
    }
    .rate-input-table th {
      padding: 3px 6px;
    }
    .rate-input-table input {
      border: 0;
      border-radius: 0;
      background: transparent;
      min-height: 26px;
      height: 26px;
      padding: 2px 4px;
    }
    .rate-input-table input[type="number"] {
      text-align: right;
    }
    .plan-status table {
      min-width: 1240px;
    }
    .plan-status th {
      background: #06ad52;
      color: #061d0f;
      text-align: center;
      border: 1px solid #1b1b1b;
    }
    .plan-status td {
      border: 1px solid #1b1b1b;
    }
    .plan-status tr.selected td {
      font-weight: 800;
      background: #f7fbef;
    }
    .plan-screen {
      display: grid;
      grid-template-rows: minmax(320px, .92fr) minmax(300px, 1fr);
      gap: 12px;
      height: calc(100vh - 146px);
      min-height: 0;
    }
    .plan-top-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 12px;
      min-height: 0;
    }
    .plan-screen .client-form-box {
      min-height: 0;
      overflow: hidden;
    }
    .plan-change-box,
    .plan-status-box {
      grid-template-rows: auto minmax(0, 1fr);
    }
    .plan-change-box .table-wrap.status-table,
    .plan-status-box .table-wrap.status-table {
      height: 100%;
      min-height: 0;
      max-height: none;
      overflow: auto;
    }
    .plan-change-box .table-wrap.status-table {
      height: 420px;
      max-height: 100%;
      overflow-y: auto;
    }
    .plan-change-box h3 {
      font-size: 22px;
    }
    .plan-change-box .table-wrap.status-table th,
    .plan-change-box .table-wrap.status-table td {
      height: 38px;
      padding: 8px 8px;
      font-size: 16px;
      line-height: 1.32;
    }
    .plan-change-box .table-wrap.status-table table {
      min-width: 780px;
    }
    .plan-status-box h3 {
      font-size: 22px;
    }
    .plan-status-box .table-wrap.status-table {
      height: 432px;
      max-height: 432px;
      overflow-y: auto;
    }
    .plan-status-box .table-wrap.status-table th,
    .plan-status-box .table-wrap.status-table td {
      height: 36px;
      padding: 7px 14px;
      font-size: 16px;
      line-height: 1.28;
    }
    .plan-status-box .plan-status thead tr:first-child th {
      z-index: 3;
    }
    .plan-status-box .plan-status thead tr:nth-child(2) th {
      top: 36px;
      z-index: 2;
    }
    .plan-input-box {
      overflow: visible;
      padding: 10px 14px;
      gap: 6px;
    }
    .plan-input-box h3 {
      font-size: 20px;
    }
    .plan-input-box label,
    .plan-input-box input,
    .plan-input-box select,
    .plan-input-box button,
    .plan-input-box th,
    .plan-input-box td {
      font-size: 16px;
    }
    .plan-input-box .topbar {
      margin-bottom: 0;
    }
    .plan-input-box button {
      padding: 5px 10px;
      min-height: 30px;
    }
    .plan-input-box .single-line-field {
      gap: 6px;
    }
    .plan-input-box .table-wrap {
      overflow: visible;
    }
    .banner {
      display: none;
      position: fixed;
      right: 18px;
      top: 18px;
      z-index: 10;
      background: #fff;
      border: 1px solid var(--line);
      border-left: 5px solid var(--amber);
      box-shadow: var(--shadow);
      border-radius: 8px;
      padding: 13px 15px;
      max-width: 360px;
    }
    .banner.show { display: block; }
    .photo-list { display: flex; gap: 6px; flex-wrap: wrap; }
    .photo-list span { background: #edf1f4; border-radius: 5px; padding: 5px 7px; font-size: 12px; }
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.34);
      z-index: 20;
      padding: 20px;
      overflow: auto;
    }
    .modal-backdrop.show { display: grid; place-items: start center; }
    .modal {
      width: min(1040px, 100%);
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      overflow-x: hidden;
      background: #fff;
      border-radius: 8px;
      border: 1px solid var(--line);
      padding: 18px;
      box-shadow: var(--shadow);
      display: grid;
      gap: 14px;
    }
    .modal .client-form-box {
      font-size: 14px;
    }
    .modal .client-form-box h3 {
      font-size: 18px;
    }
    .modal .client-form-box label,
    .modal .client-form-box input,
    .modal .client-form-box select,
    .modal .client-form-box textarea,
    .modal .client-form-box button,
    .modal .client-form-box th,
    .modal .client-form-box td {
      font-size: 14px;
    }
    .workflow-card {
      background: #f9fbfc;
      overflow: hidden;
    }
    .workflow-card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 8px;
    }
    .workflow-card-item {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      padding: 8px 9px;
    }
    .workflow-card-item .hint {
      display: block;
      font-size: 12px;
      margin-bottom: 3px;
    }
    .workflow-card-item h3 {
      font-size: 15px;
      line-height: 1.28;
      overflow-wrap: anywhere;
      word-break: keep-all;
    }
    .flag-choice {
      cursor: pointer;
      transition: border-color .15s, box-shadow .15s, background .15s;
    }
    .flag-choice:hover {
      border-color: var(--blue);
      box-shadow: 0 0 0 2px rgba(44, 108, 163, .12);
    }
    .flag-choice input {
      width: auto;
      min-height: 0;
      margin: 0 6px 0 0;
    }
    .flag-choice-title {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 6px;
    }
    .flag-choice-title h3 {
      margin: 0;
    }
    .empty { color: var(--muted); padding: 18px; text-align: center; }

    function loadState() {
      try {
        const storedVersion = localStorage.getItem(KEY + ".version");
        if (WEB_INITIAL_STATE && storedVersion !== WEB_DATA_VERSION) {
          const initial = migrateState(structuredClone(WEB_INITIAL_STATE));
          localStorage.setItem(KEY, JSON.stringify(initial));
          localStorage.setItem(KEY + ".version", WEB_DATA_VERSION);
          return initial;
        }
        return migrateState(JSON.parse(localStorage.getItem(KEY) || "null") || structuredClone(WEB_INITIAL_STATE) || seedState());
      } catch {
        return migrateState(structuredClone(WEB_INITIAL_STATE) || seedState());
      }
    }

    async function fetchState() {
      try {
        const response = await fetch("/api/state");
        if (!response.ok) throw new Error("DB fetch failed");
        return migrateState(await response.json());
      } catch (error) {
        console.error(error);
        return loadState();
      }
    }

    function migrateState(data) {
      data.clients = Array.isArray(data.clients) ? data.clients : [];
      data.staff = Array.isArray(data.staff) ? data.staff : [];
      data.staff.forEach(staff => {
        staff.authority = staff.authority || "driver";
      });
      data.venues = Array.isArray(data.venues) ? data.venues : [];
      data.venueRooms = Array.isArray(data.venueRooms) ? data.venueRooms : [];
      data.venues.forEach(venue => {
        if (venue.rooms && !data.venueRooms.some(room => room.venueId === venue.id)) {
          splitRooms(venue.rooms).forEach(roomName => data.venueRooms.push({ id: uid(), venueId: venue.id, name: roomName }));
        }
        delete venue.rooms;
      });
      data.inventories = Array.isArray(data.inventories) ? data.inventories : [];
      data.inventories.forEach(item => {
        item.initial = Number(item.initial || 0);
        item.added = Number(item.added || 0);
        item.damaged = Number(item.damaged || 0);
        item.stored = Math.max(0, item.initial + item.added - item.damaged);
      });
      data.flagItems = Array.isArray(data.flagItems) ? data.flagItems : [];
      if (!data.flagItems.length && data.inventories.length) {
        data.inventories.forEach(item => {
          const count = Math.max(0, Number(item.initial || 0) + Number(item.added || 0) - Number(item.damaged || 0));
          for (let index = 1; index <= count; index += 1) {
            data.flagItems.push({
              id: uid(),
              clientId: item.clientId,
              type: item.type,
              label: `${orderTypes[item.type] || item.type}-${String(index).padStart(2, "0")}`,
              status: "office",
              holderStaffId: "",
              siteOrderId: "",
              assignedOrderId: "",
              locationMemo: "사무실",
              updatedAt: new Date().toISOString()
            });
          }
        });
      }
      data.flagItems.forEach(item => {
        item.status = item.status || "office";
        item.holderStaffId = item.holderStaffId || "";
        item.siteOrderId = item.siteOrderId || "";
        item.assignedOrderId = item.assignedOrderId || "";
        item.locationMemo = item.locationMemo || "";
        item.updatedAt = item.updatedAt || new Date().toISOString();
      });
      data.branchStock = data.branchStock || {};
      data.plans = Array.isArray(data.plans) ? data.plans : [];
      data.planChanges = Array.isArray(data.planChanges) ? data.planChanges : [];
      data.orders = Array.isArray(data.orders) ? data.orders : [];
      data.orders.forEach(order => {
        order.recoveryStaffId = order.recoveryStaffId || "";
        order.inboundAt = order.inboundAt || "";
        order.flagItemId = order.flagItemId || "";
        order.photos = order.photos || { install: "", surroundings: "", board: "", recovery: "" };
        order.photos.surroundings = order.photos.surroundings || order.photos.board || "";
      });
      data.notifications = Array.isArray(data.notifications) ? data.notifications : [];
      data.audit = Array.isArray(data.audit) ? data.audit : [];
      return data;
    }

    function splitRooms(value) {
      return String(value || "")
        .split(/[,，]/)
        .map(room => room.trim())
        .filter(Boolean);
    }

    function save(next = state) {
      localStorage.setItem(KEY, JSON.stringify(next));
      localStorage.setItem(KEY + ".version", WEB_DATA_VERSION);
      if (!location.protocol.startsWith("http")) return;
      fetch("/api/state", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(next)
      }).catch(error => {
        console.error("DB save failed", error);
      });
    }
    function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, s => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[s]));
    }
    function fmt(dt) {
      if (!dt) return "-";
      return new Date(dt).toLocaleString("ko-KR", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
    }
    function fmtSheetDateTime(dt) {
      if (!dt) return "-";
      const date = new Date(dt);
      if (Number.isNaN(date.getTime())) return "-";
      const pad = n => String(n).padStart(2, "0");
      return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}.${pad(date.getHours())}:${pad(date.getMinutes())}`;
    }
    function toLocalInput(date) {
      const pad = n => String(n).padStart(2, "0");
      return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
    }

    function clientName(id) { return state.clients.find(x => x.id === id)?.name || "-"; }

    function venueRoomOptions(venueId, selected = "") {
      const rooms = venueRoomNames(venueId);
      if (!rooms.length) return `<option value="">호실 없음</option>`;
      return rooms.map(room => `<option value="${escapeHtml(room)}" ${selected === room ? "selected" : ""}>${escapeHtml(room)}</option>`).join("");
    }

    function orderNo(type, createdAt = new Date().toISOString(), orders = state.orders) {
      const date = createdAt.slice(0, 10);
      const letter = type === "funeral" ? "근" : type === "celebration" ? "축" : "단";
      const count = orders.filter(o => o.no.startsWith(`${date}-${letter}`)).length + 1;
      return `${date}-${letter}-${String(count).padStart(3, "0")}`;
    }

    function makeOrder(data, input) {
      const created = input.createdAt || new Date().toISOString();
      const deadline = calcDeadline(input.type, created, input.eventStart);

    function calcDeadline(type, createdAt, eventStart) {
      if ((type === "celebration" || type === "group") && eventStart) return new Date(eventStart).toISOString();
      const created = new Date(createdAt);
      if (created.getHours() >= 21) {
        const next = new Date(created);
        next.setDate(next.getDate() + 1);
        next.setHours(9, 0, 0, 0);
        return next.toISOString();
      }
      return new Date(created.getTime() + 2 * 3600000).toISOString();
    }

    function sla(order) {
      if (["설치완료", "회수완료"].includes(order.status)) return { label: "완료", tone: "green" };
      const mins = Math.round((new Date(order.deadline) - new Date()) / 60000);
      if (mins < 0) return { label: `초과 ${Math.abs(mins)}분`, tone: "red" };
      if (mins <= 30) return { label: `임박 ${mins}분`, tone: "amber" };
      return { label: `${mins}분`, tone: "blue" };
    }

    function audit(menu, action, detail, options = {}) {
      state.audit.unshift({ id: uid(), menu, action, detail, actor: currentUserName(), at: new Date().toISOString() });
      if (!options.silent) save();
    }

    function logNotifications(order) {
      const active = state.staff.filter(s => (s.authority || "driver") === "driver" && s.note === "활동");
      active.forEach(driver => {
        ["문자", "카카오톡"].forEach(channel => {
          state.notifications.unshift({
            id: uid(), channel, receiver: `${driver.name} ${driver.phone}`,
            message: `[더 플래그] 신규 ${orderTypes[order.type]} 주문 ${order.no} / ${orderVenueName(order)}`,
            status: "시뮬레이션 완료", at: new Date().toISOString()
          });
        });
      });
    }

            ["driverInbound","23. 깃발입고"]
          ]
          : [["clientOrder","주문입력"],["orders","주문현황"]];
      root.innerHTML = `
        <div class="app">
          <aside class="sidebar">
            <div class="brand"><strong>더 플래그</strong><span>깃발 제작·보관·배송 통합관리</span></div>
            <div class="user-box"><b>${escapeHtml(currentUserName())}</b><span>${roleName(session.role)}</span></div>
            <nav class="nav">
              ${menus.map(([key, label]) => `<button class="${view === key ? "active" : ""}" onclick="go('${key}')">${label}</button>`).join("")}

            </nav>

          <main class="main">
            ${renderView()}

    function roleName(role) {
      return role === "admin" ? "본사 관리자" : role === "headquarters" ? "본부" : role === "driver" ? "배송 기사" : "고객사";
    }

    function renderLogin() {
      $("root").innerHTML = `
        <section class="login">
          <div class="login-card">
            <div class="login-visual">
              <h1>전국 깃발 배송을 한 화면에서 접수, 배정, 설치, 회수합니다</h1>
              <p>근조기와 축하기 업무 특성을 분리하고, SLA와 재고 흐름을 실시간으로 확인하는 운영 프로토타입입니다.</p>
            </div>
            <form class="login-form" onsubmit="handleLogin(event)">
              <h2>로그인</h2>
              <p class="hint">먼저 사용자 유형을 선택한 뒤 아이디와 비밀번호를 입력하세요.</p>
              <input type="hidden" name="role" id="loginRole" value="admin">
              <div class="role-select">
                <button type="button" class="role-option active" data-role="admin" onclick="selectLoginRole('admin')"><b>관리자</b><span>본사 운영</span></button>
                <button type="button" class="role-option" data-role="driver" onclick="selectLoginRole('driver')"><b>기사</b><span>배송 설치</span></button>
                <button type="button" class="role-option" data-role="client" onclick="selectLoginRole('client')"><b>고객사</b><span>배송 신청</span></button>
              </div>
              <p class="hint" id="loginHint">관리자 계정을 입력하세요.</p>

              <button>접속</button>
            </form>
          </div>

    function selectLoginRole(role) {
      const samples = {
        admin: ["", "관리자 계정을 입력하세요."],
        driver: ["", "활동 상태인 기사 계정을 입력하세요."],
        client: ["", "고객사 계정을 입력하세요."]
      };
      $("loginRole").value = role;
      document.querySelectorAll(".role-option").forEach(button => {
        button.classList.toggle("active", button.dataset.role === role);
      });
      document.querySelector("input[name='login']").value = samples[role][0];
      $("loginHint").textContent = samples[role][1];
    }

    async function handleLogin(event) {
      event.preventDefault();
      const form = new FormData(event.target);
      const activeRole = document.querySelector(".role-option.active")?.dataset.role;
      const role = String(form.get("role") || activeRole || "admin").trim();
      const login = String(form.get("login") || "").trim();
      const password = String(form.get("password") || "").trim();
      const errorBox = $("loginError");
      errorBox.classList.remove("show");
      errorBox.textContent = "";
      session = await requestLogin(role, login, password);
      if (!session) {
        errorBox.textContent = `${roleName(role)} 계정 정보가 올바르지 않습니다. 선택한 사용자 유형과 아이디를 확인해 주세요.`;
        errorBox.classList.add("show");
        return;
      }
      sessionStorage.setItem("flagSession", JSON.stringify(session));
      state = await fetchState();
      orderPopupSeen = state.orders.map(order => order.id).slice(-80);
      sessionStorage.setItem("flagOrderPopupSeen", JSON.stringify(orderPopupSeen));
      view = session.role === "admin" || session.role === "headquarters" ? "dashboard" : session.role === "driver" ? "driver" : "clientOrder";
      render();
    }

    async function requestLogin(role, login, password) {
      try {
        const response = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ role, login, password })
        });
        if (!response.ok) return localLogin(role, login, password);
        const result = await response.json();
        return result.session || null;
      } catch {
        return localLogin(role, login, password);
      }
    }

    function localLogin(role, login, password) {
      state = loadState();
      if (role === "admin" || role === "headquarters") {
        const headquarters = state.staff.find(staff => staff.authority === "headquarters" && staff.login === login && staff.password === password && staff.note === "활동");
        if (headquarters) return { role: "headquarters", id: headquarters.id, login };
        const legacyHeadquarters = state.staff.find(staff => staff.authority === "headquarters" && staff.login === login && staff.note === "활동");
        if (login === "admin" && password === "05tkfkd18!@" && legacyHeadquarters) {
          legacyHeadquarters.password = password;
          save(state);
          return { role: "headquarters", id: legacyHeadquarters.id, login };
        }
      }
      if (role === "driver") {
        const driver = state.staff.find(staff => (staff.authority || "driver") === "driver" && staff.login === login && staff.password === password && staff.note === "활동");
        if (driver) return { role: "driver", id: driver.id, login };
      }
      if (role === "client") {
        const client = state.clients.find(item => item.login === login && item.password === password);
        if (client) return { role: "client", id: client.id, login };
      }
      return null;
    }
    function logout() { session = null; sessionStorage.removeItem("flagSession"); render(); }
    function go(next) { view = next; render(); }

    function renderView() {
      if (view === "dashboard") return renderDashboard();
      if (view === "orders") return renderOrders();
      if (view === "inventory") return renderInventory();
      if (view === "admin") return renderAdmin();
      if (view === "logs") return renderLogs();
      if (view === "driverAssign") return renderDriverAssignment();
      if (view === "driverPickup") return renderDriverWorkflowStage("orderPickup");
      if (view === "driverInstall") return renderDriverWorkflowStage("orderInstall");
      if (view === "driverRecoveryAssign") return renderDriverWorkflowStage("recoveryAssign");
      if (view === "driverRecovery") return renderDriverWorkflowStage("orderRecovery");
      if (view === "driverInbound") return renderDriverWorkflowStage("flagInbound");
      if (view === "driver") return renderDriver();
      if (view === "clientOrder") return renderOrderForm();
      return renderDashboard();
    }

    function renderDashboard() {
      const orders = state.orders;
      const late = orders.filter(o => ["접수","담당","배송중"].includes(o.status) && ["red","amber"].includes(sla(o).tone)).length;
      const stats = [
        ["총 주문", orders.length], ["미배정", orders.filter(o => !o.staffId).length],
        ["진행중", orders.filter(o => ["담당","배송중"].includes(o.status)).length],

      ];
      return `
        <div class="topbar"><h1>홈 대시보드</h1><div class="actions"><button onclick="exportData()">내보내기</button><button class="secondary" onclick="openImport()">가져오기</button></div></div>

        <section class="grid cols-2">
          <div class="panel"><h3>단계별 주문 분포</h3>${chart(statusFlow.map(s => [s, orders.filter(o => o.status === s).length]))}</div>
          <div class="panel"><h3>깃발종류별 주문 분포</h3>${chart([["근조기", orders.filter(o => o.type === "funeral").length],["축하기", orders.filter(o => o.type === "celebration").length]])}</div>
        </section>
        <section class="grid cols-2">
          <div class="panel"><h3>최근 주문</h3>${ordersTable(orders.slice(0, 6), true)}</div>
          <div class="panel"><h3>알림 로그</h3>${logTable(state.notifications.slice(0, 8), "notifications")}</div>
        </section>`;
    }

    function chart(rows) {
      const max = Math.max(1, ...rows.map(r => r[1]));
      return `<div class="grid" style="margin-top:14px">${rows.map(([label, value], i) =>
        `<div class="chart-row"><span>${label}</span><div class="bar"><i style="width:${value / max * 100}%; background:${["var(--green)","var(--blue)","var(--amber)","var(--violet)","var(--red)"][i % 5]}"></i></div><b>${value}</b></div>`
      ).join("")}</div>`;
    }

    function renderOrders() {
      let orders = [...state.orders].sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));

        return `

          <div class="tabs">${orderTabs.map(([key, label]) => `<button class="${selectedOrderTab === key ? "active" : ""}" onclick="selectedOrderTab='${key}'; render()">${label}</button>`).join("")}</div>
          <section class="panel">${renderOrderTab()}</section>`;
      }
      return `
        <div class="topbar"><h1>주문현황</h1><div class="actions">${session.role === "client" ? `<button onclick="go('clientOrder')">주문 입력</button>` : ""}</div></div>
        <section class="panel">${ordersTable(orders)}</section>`;
    }

    function renderOrderTab() {
      const orders = [...state.orders].sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
      if (selectedOrderTab === "orderInput") return renderOrderInputPanel();
      if (selectedOrderTab === "orderAssign") return renderOrderAssignmentBoard(orders);
      if (["orderPickup","orderInstall","recoveryAssign","orderRecovery","flagInbound"].includes(selectedOrderTab)) return renderWorkflowStageBoard(selectedOrderTab, orders);
      return renderOrderInputPanel();
    }

    function orderTabHeader(title, description) {
      return `<div class="topbar" style="margin-bottom:12px"><div><h3>${title}</h3><p class="hint">${description}</p></div></div>`;
    }

    function renderDriverAssignment() {
      const orders = [...state.orders].sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
      return `

        <section class="panel">${renderOrderAssignmentBoard(orders)}</section>`;

    function renderOrderAssignmentBoard(orders) {
      const unassigned = orders.filter(o => !o.staffId);
      const assigned = orders.filter(o => {
        if (!o.staffId) return false;
        return session.role === "driver" ? o.staffId === session.id : true;
      });
      const selectedOrder = assigned.find(order => order.id === selectedAssignmentOrderId) || assigned[0] || null;
      if (selectedOrder && selectedAssignmentOrderId !== selectedOrder.id) selectedAssignmentOrderId = selectedOrder.id;
      return `
        ${orderTabHeader("11. 주문배정", "미지정 배송건은 상단에, 지정된 배송건은 하단에 표시됩니다.")}
        <div class="order-assign-board">
          <div class="client-form-box">
            <h3>미지정 배송건 (${unassigned.length})</h3>
            ${orderAssignmentTable(unassigned, true)}

          <div class="client-form-box">
            <h3>지정된 배송건 (${assigned.length})</h3>
            ${orderAssignmentTable(assigned, session.role !== "driver", true)}
          </div>
          <div class="client-form-box">
            <h3>고객사별 깃발 보관 현황${selectedOrder ? ` - ${escapeHtml(clientName(selectedOrder.clientId))}` : ""}</h3>
            ${flagLocationStatusTable(selectedOrder)}

    function renderDriverWorkflowStage(stageKey) {

      return `
        <div class="topbar"><h1>${spec.title}</h1></div>

    function workflowStageSpec(stageKey) {
      const specs = {
        orderPickup: {
          title: "12. 깃발출고",
          description: "사전 배정된 깃발을 인계받은 뒤 배송중 상태만 선택할 수 있습니다.",
          pendingTitle: "배송중 처리 대상",
          doneTitle: "배송중 처리 완료",

          done: order => order.status === "배송중"
        },
        orderInstall: {

          pendingTitle: "설치 처리 대상",
          doneTitle: "설치완료",

        },
        recoveryAssign: {

          pendingTitle: "회수배정 대상",
          doneTitle: "회수배정 완료",
          pending: order => order.status === "설치완료" && isOrderRecoveryDue(order) && !order.recoveryStaffId,
          done: order => order.status === "설치완료" && isOrderRecoveryDue(order) && !!order.recoveryStaffId
        },
        orderRecovery: {
          title: "22. 깃발회수",
          description: "회수 현장 사진을 업로드하고 회수완료 상태로 변경합니다.",
          pendingTitle: "회수 처리 대상",
          doneTitle: "회수완료",
          pending: order => order.status === "설치완료" && !!order.recoveryStaffId,
          done: order => order.status === "회수완료"
        },
        flagInbound: {
          title: "23. 깃발입고",
          description: "회수한 깃발을 사무실에 입고 등록합니다.",
          pendingTitle: "입고 처리 대상",
          doneTitle: "입고완료",
          pending: order => order.status === "회수완료",
          done: order => order.status === "입고완료"
        }
      };
      return specs[stageKey] || specs.orderPickup;
    }

    function renderWorkflowStageBoard(stageKey, orders) {
      const spec = workflowStageSpec(stageKey);
      const scoped = orders.filter(order => workflowOrderVisibleForSession(stageKey, order));
      const pending = scoped.filter(spec.pending);
      const done = scoped.filter(spec.done);
      const selectedOrder = [...pending, ...done].find(order => order.id === selectedAssignmentOrderId) || pending[0] || done[0] || null;
      if (selectedOrder && selectedAssignmentOrderId !== selectedOrder.id) selectedAssignmentOrderId = selectedOrder.id;
      return `
        ${orderTabHeader(spec.title, spec.description)}
        <div class="order-assign-board">
          <div class="client-form-box">
            <h3>${spec.pendingTitle} (${pending.length})</h3>
            ${orderAssignmentTable(pending, false, true, "stage")}
          </div>
          <div class="client-form-box">
            <h3>${spec.doneTitle} (${done.length})</h3>
            ${orderAssignmentTable(done, false, true, "stage")}
          </div>
          <div class="client-form-box">
            <h3>고객사별 깃발 보관 현황${selectedOrder ? ` - ${escapeHtml(clientName(selectedOrder.clientId))}` : ""}</h3>
            ${flagLocationStatusTable(selectedOrder)}
          </div>
        </div>`;
    }

    function workflowOrderVisibleForSession(stageKey, order) {
      if (session.role !== "driver") return true;
      if (stageKey === "recoveryAssign") return !order.recoveryStaffId || order.recoveryStaffId === session.id;
      if (stageKey === "orderRecovery") return order.recoveryStaffId === session.id;
      if (stageKey === "flagInbound") return (order.recoveryStaffId || order.staffId) === session.id;
      return order.staffId === session.id;
    }

    function activeDriverRows() {
      return state.staff.filter(staff => (staff.authority || "driver") === "driver" && staff.note === "활동");
    }

    function driverAssignSelect(order, includeButton = true) {
      const options = [`<option value="">기사 선택</option>`].concat(activeDriverRows().map(driver => `<option value="${driver.id}" ${order.staffId === driver.id ? "selected" : ""}>${escapeHtml(driver.name)} · ${escapeHtml(driver.branch || "-")}</option>`)).join("");
      return `<div class="order-assign-action"><select id="assign_${order.id}">${options}</select>${includeButton ? `<button onclick="assignOrderToStaff('${order.id}')">배정</button>` : ""}</div>`;
    }

    function orderAssignmentTable(orders, canAssign, selectable = false, actionMode = "assign") {
      const heads = ["주문번호","등록일시","구분","입력주체","고객사","행사장","설치호실","주소","고객명","안치일시","발인일시","요청사항","상태","SLA","담당", actionMode === "stage" ? "처리" : "기사선택"];
      const blankRow = `<tr>${heads.map(() => `<td>&nbsp;</td>`).join("")}</tr>`;
      const rows = orders.map(o => {
        const s = sla(o);
        const isFuneral = o.type === "funeral";
        const action = actionMode === "stage"
          ? stageActionButton(o)
          : canAssign
          ? `<button onclick="openAssignmentPopup('${o.id}')">배정</button>`
          : `<button class="secondary" onclick="openOrderDetail('${o.id}')">열기</button>`;
        const rowClick = actionMode === "stage"
          ? `handleStageRowClick('${o.id}')`
          : canAssign
            ? `openAssignmentPopup('${o.id}')`
            : selectable
              ? `selectAssignmentOrder('${o.id}')`
              : `openOrderDetail('${o.id}')`;
        const assignAttr = canAssign ? ` data-assign-order="${o.id}"` : "";
        return `<tr class="${selectable && selectedAssignmentOrderId === o.id ? "selected" : ""}"${assignAttr} onclick="${rowClick}" style="${canAssign || actionMode === "stage" || selectable ? "cursor:pointer" : ""}">
          <td>${escapeHtml(o.no)}</td>
          <td>${fmtSheetDateTime(o.createdAt)}</td>
          <td><span class="badge ${o.type === "funeral" ? "violet" : o.type === "group" ? "amber" : "green"}">${orderTypes[o.type]}</span></td>
          <td>${escapeHtml(o.inputSubject || "-")}</td>
          <td>${escapeHtml(clientName(o.clientId))}</td>
          <td>${escapeHtml(orderVenueName(o))}</td>
          <td>${escapeHtml(o.room || "-")}</td>
          <td>${escapeHtml(orderVenueAddress(o))}</td>
          <td>${isFuneral ? escapeHtml(o.mourner || "-") : "-"}</td>
          <td>${isFuneral ? escapeHtml(o.enshrineAt || "-") : "-"}</td>
          <td>${isFuneral ? fmtSheetDateTime(o.burialAt) : "-"}</td>
          <td>${escapeHtml(o.request || "-")}</td>
          <td>${statusBadge(o.status)}</td>
          <td><span class="badge ${s.tone}">${s.label}</span> ${fmtSheetDateTime(o.deadline)}</td>

          <td onclick="event.stopPropagation()">${action}</td>
        </tr>`;
      });
      return `<div class="table-wrap status-table"><table>
        <thead><tr>${heads.map(h => `<th>${h}</th>`).join("")}</tr></thead>
        <tbody>${rows.join("")}${statusBlankRows(heads.length, rows.length, "표시할 주문이 없습니다.")}</tbody>
      </table></div>`;
    }

    function stageActionButton(order) {
      if (selectedOrderTab === "orderPickup" && order.status === "담당") return `<button onclick="openStageActionPopup('${order.id}')">배송중</button>`;
      if (selectedOrderTab === "orderInstall" && order.status === "배송중") return session.role === "driver" ? `<button class="green" onclick="openCompleteModal('${order.id}')">설치완료</button>` : `<button class="secondary" onclick="openOrderDetail('${order.id}')">열기</button>`;
      if (selectedOrderTab === "recoveryAssign" && order.status === "설치완료" && !order.recoveryStaffId && isOrderRecoveryDue(order)) return `<button class="amber" onclick="openStageActionPopup('${order.id}')">회수배정</button>`;
      if (selectedOrderTab === "orderRecovery" && order.status === "설치완료" && (session.role !== "driver" || order.recoveryStaffId === session.id)) return `<button class="amber" onclick="openRecoverModal('${order.id}')">회수완료</button>`;
      if (selectedOrderTab === "flagInbound" && order.status === "회수완료") return `<button class="green" onclick="openStageActionPopup('${order.id}')">입고등록</button>`;
      return `<button class="secondary" onclick="openOrderDetail('${order.id}')">열기</button>`;
    }

    function openAssignmentPopup(id) {
      const order = orderById(id);
      if (!order) return;
      selectedAssignmentOrderId = id;
      const action = session.role === "driver"
        ? `<button onclick="confirmAssignmentFromPopup('${id}')">선택한 깃발로 본인 배정</button>`
        : `<div class="client-form-box" style="box-shadow:none"><h3>배송기사 선택</h3>${driverAssignSelect(order, false)}</div><button onclick="confirmAssignmentFromPopup('${id}')">선택한 깃발과 기사로 배정</button>`;
      openModal(`
        <div class="modal">
          <div class="topbar"><h2>주문배정</h2><button class="secondary" onclick="closeModal()">닫기</button></div>
          ${workflowOrderCard(order, "미지정 배송건")}
          <div class="client-form-box" style="box-shadow:none">
            <h3>고객사별 깃발 보관 현황 - 깃발 선택</h3>
            ${flagLocationChoiceList(order)}
          </div>
          ${action}
        </div>`);
    }

    function handleStageRowClick(id) {
      selectedAssignmentOrderId = id;
      const order = orderById(id);
      if (!order) return;
      if (canOpenStageActionPopup(order)) {
        openStageActionPopup(id);
        return;
      }
      render();
    }

    function canOpenStageActionPopup(order) {
      if (selectedOrderTab === "orderPickup") return order.status === "담당";
      if (selectedOrderTab === "recoveryAssign") return order.status === "설치완료" && !order.recoveryStaffId && isOrderRecoveryDue(order);
      if (selectedOrderTab === "orderRecovery") return order.status === "설치완료" && !!order.recoveryStaffId && (session.role !== "driver" || order.recoveryStaffId === session.id);
      if (selectedOrderTab === "flagInbound") return order.status === "회수완료";
      return false;
    }

    function openStageActionPopup(id) {
      const order = orderById(id);
      if (!order) return;
      selectedAssignmentOrderId = id;
      if (selectedOrderTab === "orderRecovery") {
        openRecoverModal(id);
        return;
      }
      if (selectedOrderTab === "orderPickup") {
        openModal(`
          <div class="modal">
            <div class="topbar"><h2>배송중 처리</h2><button class="secondary" onclick="closeModal()">닫기</button></div>
            ${workflowOrderCard(order, "배송중 처리 대상")}
            <div class="client-form-box" style="box-shadow:none">
              <h3>배정 깃발</h3>
              <p>${orderFlagSummary(order)}</p>
            </div>
            <button onclick="pickupFlagForOrder('${id}')">배송중으로 변경</button>
          </div>`);
        return;
      }
      if (selectedOrderTab === "recoveryAssign") {
        openModal(`
          <div class="modal">
            <div class="topbar"><h2>회수배정</h2><button class="secondary" onclick="closeModal()">닫기</button></div>
            ${workflowOrderCard(order, "회수배정 대상")}
            <div class="client-form-box" style="box-shadow:none">
              <h3>배정 깃발</h3>
              <p>${orderFlagSummary(order)}</p>
            </div>
            <button class="amber" onclick="assignRecoveryToMe('${id}')">내 회수 업무로 배정</button>
          </div>`);
        return;
      }
      if (selectedOrderTab === "flagInbound") {
        openInboundModal(id);
        return;
      }
      openOrderDetail(id);
    }

    function workflowOrderCard(o, title) {
      const isFuneral = o.type === "funeral";
      const startAt = isFuneral ? o.enshrineAt : o.eventStart;
      const endAt = isFuneral ? o.burialAt : o.eventEnd;
      return `
        <div class="client-form-box workflow-card" style="box-shadow:none">
          <div class="topbar"><h3>${title}</h3>${statusBadge(o.status)}</div>
          <div class="workflow-card-grid">
            ${workflowCardItem("주문번호", escapeHtml(o.no))}
            ${workflowCardItem("등록일시", fmtSheetDateTime(o.createdAt))}
            ${workflowCardItem("구분", escapeHtml(orderTypes[o.type] || o.type))}
            ${workflowCardItem("입력주체", escapeHtml(o.inputSubject || "-"))}
            ${workflowCardItem("고객사", escapeHtml(clientName(o.clientId)))}
            ${workflowCardItem("행사장", escapeHtml(orderVenueName(o)))}
            ${workflowCardItem("설치호실", escapeHtml(o.room || "-"))}
            ${workflowCardItem("주소", escapeHtml(orderVenueAddress(o)))}
            ${workflowCardItem("고객명", isFuneral ? escapeHtml(o.mourner || "-") : escapeHtml(o.eventTitle || "-"))}
            ${workflowCardItem("시작일시", formatOrderCardDate(startAt))}
            ${workflowCardItem("종료일시", formatOrderCardDate(endAt))}
            ${workflowCardItem("요청사항", escapeHtml(o.request || "-"))}
            ${workflowCardItem("상태", escapeHtml(o.status || "-"))}
            ${workflowCardItem("담당", escapeHtml(staffName(o.staffId)))}
            ${workflowCardItem("변경상태", escapeHtml(nextStatusLabelForCard(o)))}
          </div>
        </div>`;
    }

    function workflowCardItem(label, value) {
      return `<div class="workflow-card-item"><span class="hint">${label}</span><h3>${value || "-"}</h3></div>`;
    }

    function flagLocationCardList(order) {
      const items = flagRowsForOrder(order);
      if (!items.length) return `<div class="empty">배정 가능한 깃발 보관 현황이 없습니다.</div>`;
      return `<div class="workflow-card-grid">${items.map(item => `
        <div class="workflow-card-item">
          <span class="hint">${escapeHtml(orderTypes[item.type] || item.type)}</span>
          <h3>${escapeHtml(item.label || item.id)}</h3>
          <div>${flagStatusBadge(item)}</div>
          <p class="hint">${flagLocationText(item).replace(/<br>/g, " / ").replace(/<[^>]+>/g, "")}</p>
        </div>`).join("")}</div>`;
    }

    function flagLocationChoiceList(order) {
      const items = flagRowsForOrder(order);
      if (!items.length) return `<div class="empty">배정 가능한 깃발 보관 현황이 없습니다.</div>`;
      return `<div class="workflow-card-grid">${items.map(item => {
        const assignedHere = item.assignedOrderId === order.id || order.flagItemId === item.id;
        const canAssign = canPreassignFlag(item, order);
        const disabledReason = flagAssignDisabledReason(item, order);
        return `
          <label class="workflow-card-item flag-choice">
            <div class="flag-choice-title">
              <input type="radio" name="assignmentFlagItemId" value="${item.id}" ${assignedHere ? "checked" : ""} ${canAssign || assignedHere ? "" : "disabled"}>
              <h3>${escapeHtml(item.label || item.id)}</h3>
            </div>
            <span class="hint">${escapeHtml(orderTypes[item.type] || item.type)}</span>
            <div>${flagStatusBadge(item)}</div>
            <p class="hint">${flagLocationText(item).replace(/<br>/g, " / ").replace(/<[^>]+>/g, "")}</p>
            ${disabledReason && !assignedHere ? `<span class="badge red">${escapeHtml(disabledReason)}</span>` : ""}
          </label>`;
      }).join("")}</div>`;
    }

    function selectedAssignmentFlagId() {
      return document.querySelector("input[name='assignmentFlagItemId']:checked")?.value || "";
    }

    function confirmAssignmentFromPopup(orderId) {
      const order = orderById(orderId);
      if (!order) return;
      const flagItemId = selectedAssignmentFlagId();
      if (!flagItemId) {
        alert("배정할 깃발을 먼저 선택해 주세요.");
        return;
      }
      if (!preassignFlagToOrder(orderId, flagItemId, { silent: true })) return;
      if (session.role === "driver") {
        takeOrder(orderId);
        return;
      }
      assignOrderToStaff(orderId);
    }

    function formatOrderCardDate(value) {
      if (!value) return "-";
      return String(value).includes("T") ? fmtSheetDateTime(value) : escapeHtml(value);
    }

    function nextStatusLabelForCard(order) {
      if (selectedOrderTab === "orderAssign" || (!order.staffId && order.status === "접수")) return "배정";
      if (selectedOrderTab === "orderPickup" && order.status === "담당") return "배송중";
      if (selectedOrderTab === "orderInstall" && order.status === "배송중") return "설치완료";
      if (selectedOrderTab === "recoveryAssign" && order.status === "설치완료" && !order.recoveryStaffId) return "회수배정";
      if (selectedOrderTab === "orderRecovery" && order.status === "설치완료") return "회수완료";
      if (selectedOrderTab === "flagInbound" && order.status === "회수완료") return "입고완료";
      return order.status || "-";
    }

    function selectAssignmentOrder(id) {
      selectedAssignmentOrderId = id;
      render();
    }

    function flagLocationStatusTable(order) {
      if (!order) {
        return `<div class="table-wrap status-table flag-location-table"><table>
          <thead><tr><th>깃발</th><th>유형</th><th>보관 상태</th><th>세부 위치</th><th>회수 가능</th><th>사전 배정</th></tr></thead>
          <tbody>${statusBlankRows(6, 0, "지정된 배송건을 선택해 주세요.")}</tbody>
        </table></div>`;
      }
      const items = flagRowsForOrder(order);
      const rows = items.map(item => {
        const assignedHere = item.assignedOrderId === order.id || order.flagItemId === item.id;
        const canAssign = canPreassignFlag(item, order);
        const disabledReason = flagAssignDisabledReason(item, order);
        return `<tr>
          <td><b>${escapeHtml(item.label || item.id)}</b></td>
          <td><span class="badge ${item.type === "funeral" ? "violet" : item.type === "group" ? "amber" : "green"}">${escapeHtml(orderTypes[item.type] || item.type)}</span></td>
          <td>${flagStatusBadge(item)}</td>
          <td>${flagLocationText(item)}</td>
          <td>${flagAvailableText(item)}</td>
          <td>${assignedHere ? `<span class="badge green">배정됨</span>` : `<button ${canAssign ? "" : "disabled"} onclick="event.stopPropagation(); preassignFlagToOrder('${order.id}','${item.id}')">${disabledReason || "깃발 배정"}</button>`}</td>
        </tr>`;
      });
      return `<div class="table-wrap status-table flag-location-table"><table>
        <thead><tr><th>깃발</th><th>유형</th><th>보관 상태</th><th>세부 위치</th><th>회수 가능</th><th>사전 배정</th></tr></thead>
        <tbody>${rows.join("")}${statusBlankRows(6, rows.length, "배정 가능한 깃발 보관 현황이 없습니다.")}</tbody>
      </table></div>`;
    }

    function flagRowsForOrder(order) {
      return (state.flagItems || [])
        .filter(item => item.clientId === order.clientId && item.type === order.type)
        .sort((a,b) => {
          const score = value => ({ office: 0, driver: 1, site: 2 }[value.status] ?? 3);
          return score(a.status) - score(b.status) || String(a.label).localeCompare(String(b.label), "ko");
        });
    }

    function flagById(id) {
      return (state.flagItems || []).find(item => item.id === id);
    }

    function orderById(id) {
      return state.orders.find(order => order.id === id);
    }

    function assignedFlag(order) {
      return flagById(order.flagItemId);
    }

    function flagStatusBadge(item) {
      const label = ({ office: "사무실 보관", driver: "기사님 보유", site: "현장 설치" })[item.status] || item.status;
      const tone = item.status === "office" ? "blue" : item.status === "driver" ? "amber" : "violet";
      return `<span class="badge ${tone}">${label}</span>`;
    }

    function flagLocationText(item) {
      if (item.status === "office") return escapeHtml(item.locationMemo || "사무실");
      if (item.status === "driver") return `보유 기사: ${escapeHtml(staffName(item.holderStaffId))}`;
      if (item.status === "site") {
        const order = orderById(item.siteOrderId);
        if (!order) return escapeHtml(item.locationMemo || "현장");
        return `${escapeHtml(orderVenueName(order))} ${escapeHtml(order.room || "-")}<br><span class="hint">${escapeHtml(order.no)}</span>`;
      }
      return escapeHtml(item.locationMemo || "-");
    }

    function flagAvailableAt(item) {
      if (item.status !== "site") return "";
      const order = orderById(item.siteOrderId);
      if (!order) return "";
      return order.recoveryDue || order.burialAt || order.eventEnd || "";
    }

    function isFlagRecoverable(item) {
      const at = flagAvailableAt(item);
      return !at || new Date(at) <= new Date();
    }

    function flagAvailableText(item) {
      if (item.status !== "site") return "-";
      const at = flagAvailableAt(item);
      const recoverable = isFlagRecoverable(item);
      return `<span class="badge ${recoverable ? "green" : "amber"}">${recoverable ? "가능" : "대기"}</span>${at ? `<br><span class="hint">${fmtSheetDateTime(at)}</span>` : ""}`;
    }

    function canPreassignFlag(item, order) {
      if (!item || !order) return false;
      if (item.assignedOrderId && item.assignedOrderId !== order.id) return false;
      if (order.flagItemId && order.flagItemId !== item.id) return false;
      return true;
    }

    function flagAssignDisabledReason(item, order) {
      if (item.assignedOrderId && item.assignedOrderId !== order.id) return "다른 주문 배정";
      if (order.flagItemId && order.flagItemId !== item.id) return "주문 배정 완료";
      return "";
    }

    function preassignFlagToOrder(orderId, flagItemId, options = {}) {
      const order = orderById(orderId);
      const item = flagById(flagItemId);
      if (!order || !item || !canPreassignFlag(item, order)) return;
      if (order.flagItemId && order.flagItemId !== item.id) {
        const previous = flagById(order.flagItemId);
        if (previous) previous.assignedOrderId = "";
      }
      order.flagItemId = item.id;
      item.assignedOrderId = order.id;
      item.updatedAt = new Date().toISOString();
      audit("깃발배정", "사전배정", `${order.no} ${item.label || item.id}`, { silent: options.silent });
      if (options.silent) return true;
      save();
      render();
      return true;
    }

    function ordersTable(orders, compact = false) {
      const colCount = compact ? 7 : 8;
      const rows = orders.map(o => {
        const s = sla(o);
        return `<tr onclick="${compact ? "" : `openOrderDetail('${o.id}')`}">
          <td>${o.no}<br><span class="hint">${fmt(o.createdAt)}</span></td>
          <td><span class="badge ${o.type === "funeral" ? "violet" : o.type === "group" ? "amber" : "green"}">${orderTypes[o.type]}</span></td>
          <td>${escapeHtml(clientName(o.clientId))}</td>
          <td>${escapeHtml(orderVenueName(o))}<br><span class="hint">${escapeHtml(o.room)}</span></td>
          <td>${statusBadge(o.status)}</td>
          <td><span class="badge ${s.tone}">${s.label}</span><br><span class="hint">${fmt(o.deadline)}</span></td>
          <td>${escapeHtml(staffName(o.staffId))}</td>
          ${compact ? "" : `<td><button class="secondary" onclick="event.stopPropagation(); openOrderDetail('${o.id}')">열기</button></td>`}
        </tr>`;
      });
      return `<div class="table-wrap status-table"><table>
        <thead><tr><th>주문번호</th><th>구분</th><th>고객사</th><th>장소</th><th>상태</th><th>SLA</th><th>담당</th>${compact ? "" : "<th>처리</th>"}</tr></thead>
        <tbody>${rows.join("")}${statusBlankRows(colCount, rows.length, "표시할 주문이 없습니다.")}</tbody></table></div>`;
    }

    function statusBadge(status) {
      const tone = status === "접수" ? "amber" : ["설치완료", "회수완료", "입고완료"].includes(status) ? "green" : "blue";
      return `<span class="badge ${tone}">${status}</span>`;
    }

    function statusBlankRows(colCount, currentCount, emptyMessage = "", targetRows = 10) {
      const blankRow = `<tr>${Array.from({ length: colCount }, () => `<td>&nbsp;</td>`).join("")}</tr>`;
      return Array.from({ length: Math.max(0, targetRows - currentCount) }, (_, index) => {
        if (currentCount === 0 && index === 0 && emptyMessage) {
          return `<tr><td class="empty" colspan="${colCount}">${emptyMessage}</td></tr>`;
        }
        return blankRow;
      }).join("");
    }

    function renderOrderInputPanel() {
      const createdAt = toLocalInput(new Date());
      const inputSubject = session.role === "client" ? "직접" : "더플래그";
      const clientId = session.role === "client" ? session.id : "";
      return `
        <div class="order-input-layout">
          <form class="client-form-box" onsubmit="createOrderFromPanel(event)">
            <div class="topbar">
              <div><h3>주문입력</h3></div>
            </div>
            <input type="hidden" name="type" value="${selectedOrderType}">
            <input type="hidden" name="createdAt" value="${createdAt}">
            <div class="status-select">
              ${[["funeral","근조기"],["celebration","축하기"],["group","단체기"]].map(([key, label]) => `<button type="button" class="${selectedOrderType === key ? "active" : ""}" onclick="selectedOrderType='${key}'; render()">${label}</button>`).join("")}
            </div>
            ${selectedOrderType === "funeral" ? funeralOrderFields(inputSubject, clientId, createdAt) : eventOrderFields(inputSubject, clientId, createdAt)}
            <button>등록</button>
          </form>
          <div class="client-form-box order-input-status">
            <h3 style="margin:0 0 10px">주문입력 현황 (${orderInputRows().length})</h3>
            ${orderInputStatusTable(orderInputRows())}
          </div>
        </div>`;
    }

    function orderInputStatusTable(orders) {
      const heads = ["주문번호","등록일시","구분","입력주체","고객사","장례식장","빈소호실","주소","상주명","안치일시","발인일시","요청사항","상태","SLA","담당","처리"];
      const blankRow = `<tr>${heads.map(() => `<td>&nbsp;</td>`).join("")}</tr>`;
      const emptyRows = Array.from({ length: 10 }, (_, index) => index === 0
        ? `<tr><td class="empty" colspan="${heads.length}">표시할 주문이 없습니다.</td></tr>`
        : blankRow
      ).join("");
      if (!orders.length) return `<div class="table-wrap status-table"><table><thead><tr>${heads.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${emptyRows}</tbody></table></div>`;
      const rows = orders.map(o => {
        const s = sla(o);
        const isFuneral = o.type === "funeral";
        return `<tr onclick="openOrderDetail('${o.id}')">
          <td>${escapeHtml(o.no)}</td>
          <td>${fmtSheetDateTime(o.createdAt)}</td>
          <td><span class="badge ${o.type === "funeral" ? "violet" : o.type === "group" ? "amber" : "green"}">${orderTypes[o.type]}</span></td>
          <td>${escapeHtml(o.inputSubject || "-")}</td>
          <td>${escapeHtml(clientName(o.clientId))}</td>
          <td>${escapeHtml(orderVenueName(o))}</td>
          <td>${escapeHtml(o.room || "-")}</td>
          <td>${escapeHtml(orderVenueAddress(o))}</td>
          <td>${isFuneral ? escapeHtml(o.mourner || "-") : "-"}</td>
          <td>${isFuneral ? escapeHtml(o.enshrineAt || "-") : "-"}</td>
          <td>${isFuneral ? fmtSheetDateTime(o.burialAt) : "-"}</td>
          <td>${escapeHtml(o.request || "-")}</td>
          <td>${statusBadge(o.status)}</td>
          <td><span class="badge ${s.tone}">${s.label}</span> ${fmtSheetDateTime(o.deadline)}</td>
          <td>${escapeHtml(staffName(o.staffId))}</td>
          <td><button class="secondary" onclick="event.stopPropagation(); openOrderDetail('${o.id}')">열기</button></td>
        </tr>`;
      });
      while (rows.length < 10) rows.push(blankRow);
      return `<div class="table-wrap status-table"><table>
        <thead><tr>${heads.map(h => `<th>${h}</th>`).join("")}</tr></thead>
        <tbody>${rows.join("")}</tbody></table></div>`;
    }

    function orderInputRows() {
      return [...state.orders]
        .filter(o => session.role !== "client" || o.clientId === session.id)
        .sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
    }

    function clientSelectHtml(selectedId = "") {
      return `<select name="clientId" ${session.role === "client" ? "disabled" : ""} required>
        <option value="">고객사 선택</option>
        ${state.clients.map(client => `<option value="${client.id}" ${client.id === selectedId ? "selected" : ""}>${escapeHtml(client.name)}</option>`).join("")}
      </select>${session.role === "client" ? `<input type="hidden" name="clientId" value="${selectedId}">` : ""}`;
    }

    function venueSelectHtml(type, selectedId = "") {
      const venues = state.venues.filter(venue => venue.type === type);

    function hourOptions(selected = "") {
      return Array.from({ length: 24 }, (_, hour) => {

    function tenMinuteOptions(selected = "") {
      return [0, 10, 20, 30, 40, 50].map(minute => {

    function dateTimeParts(name, required = false) {
      return `
        <input type="hidden" name="${name}" id="${name}Input">
        <div class="datetime-parts">
          <input id="${name}DateInput" type="date" onchange="syncDateTimeParts('${name}')" ${required ? "required" : ""}>
          <select id="${name}HourInput" onchange="syncDateTimeParts('${name}')">${hourOptions()}</select>
          <select id="${name}MinuteInput" onchange="syncDateTimeParts('${name}')">${tenMinuteOptions()}</select>
        </div>`;
    }

    function syncDateTimeParts(name) {
      const date = $(`${name}DateInput`)?.value || "";
      const hour = $(`${name}HourInput`)?.value || "00";
      const minute = $(`${name}MinuteInput`)?.value || "00";
      const input = $(`${name}Input`);
      if (input) input.value = date ? `${date}T${hour}:${minute}` : "";
    }

    function syncBurialAtFromParts() {
      const date = $("burialDateInput")?.value || "";
      const hour = $("burialHourInput")?.value || "00";
      const minute = $("burialMinuteInput")?.value || "00";
      const input = $("burialAtInput");
      if (input) input.value = date ? `${date}T${hour}:${minute}` : "";
    }

    function setBurialAtControls(value) {
      const rounded = roundDateTimeLocalToTenMinutes(value);
      const [date, time = "00:00"] = rounded.split("T");
      const [hour = "00", minute = "00"] = time.split(":");
      if ($("burialDateInput")) $("burialDateInput").value = date || "";
      if ($("burialHourInput")) $("burialHourInput").value = hour;
      if ($("burialMinuteInput")) $("burialMinuteInput").value = minute;
      if ($("burialAtInput")) $("burialAtInput").value = rounded;
    }

    function parseBurialDateTime(text) {
      const source = String(text || "").replace(/\s+/g, " ");
      const patterns = [
        /발인(?:일시|일|시간)?\s*[:：]?\s*(\d{1,2})[./월-]\s*(\d{1,2})\s*(?:일)?\s*(?:(오전|오후|AM|PM|am|pm)?\s*(\d{1,2})(?:[:시]\s*(\d{1,2}))?)?/,
        /(\d{1,2})[./월-]\s*(\d{1,2})\s*(?:일)?\s*(?:(오전|오후|AM|PM|am|pm)?\s*(\d{1,2})(?:[:시]\s*(\d{1,2}))?)?\s*발인/
      ];
      for (const pattern of patterns) {
        const match = source.match(pattern);
        if (!match) continue;
        const month = Number(match[1]);
        const day = Number(match[2]);
        let hour = match[4] ? Number(match[4]) : 0;
        const minute = match[5] ? Number(match[5]) : 0;
        const meridiem = (match[3] || "").toLowerCase();
        if ((meridiem === "오후" || meridiem === "pm") && hour < 12) hour += 12;
        if ((meridiem === "오전" || meridiem === "am") && hour === 12) hour = 0;
        const year = inferYearForMonthDay(month, day);
        return roundDateTimeLocalToTenMinutes(`${year}-${String(month).padStart(2,"0")}-${String(day).padStart(2,"0")}T${String(hour).padStart(2,"0")}:${String(minute).padStart(2,"0")}`);
      }
      return "";
    }

    function roundDateTimeLocalToTenMinutes(value) {
      if (!value) return "";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      const rounded = new Date(Math.round(date.getTime() / 600000) * 600000);
      return toLocalInput(rounded);
    }

    function inferYearForMonthDay(month, day) {
      const now = new Date();
      const candidate = new Date(now.getFullYear(), month - 1, day);
      if (candidate < new Date(now.getTime() - 30 * 24 * 3600000)) return now.getFullYear() + 1;
      return now.getFullYear();
    }

    function createOrderFromPanel(event) {
      event.preventDefault();
      syncBurialAtFromParts();
      syncDateTimeParts("eventStart");
      syncDateTimeParts("eventEnd");
      const data = Object.fromEntries(new FormData(event.target).entries());
      if (!normalizeManualVenue(data)) return;
      data.createdAt = new Date(data.createdAt || new Date()).toISOString();
      if (session.role === "client") {
        data.clientId = session.id;
        data.inputSubject = "직접";
      }
      if (session.role === "admin" || session.role === "headquarters") data.inputSubject = data.inputSubject || "더플래그";
      if (data.burialAt) data.burialAt = roundDateTimeLocalToTenMinutes(data.burialAt);
      if (data.eventStart) data.eventStart = roundDateTimeLocalToTenMinutes(data.eventStart);
      if (data.eventEnd) data.eventEnd = roundDateTimeLocalToTenMinutes(data.eventEnd);
      if ((data.type === "celebration" || data.type === "group") && (!data.eventStart || !data.eventEnd)) {
        alert("행사시작일시와 행사종료일시를 입력해 주세요.");
        return;
      }
      const order = makeOrder(state, data);
      state.orders.unshift(order);
      logNotifications(order);
      audit("주문", "등록", `${order.no} ${orderTypes[order.type]} 접수`);
      save();
      selectedOrderTab = "orderAssign";
      render();
    }

    function normalizeManualVenue(data) {
      if (data.venueId !== "__manual__") return true;
      data.manualVenueName = String(data.manualVenueName || "").trim();
      data.manualVenueAddress = String(data.manualVenueAddress || "").trim();
      data.room = String(data.manualRoom || data.room || "").trim();
      data.venueId = "";
      if (!data.manualVenueName) {
        alert("장소명을 직접 입력해 주세요.");
        return false;
      }
      if (!data.room) {
        alert("호실/홀/룸번호를 직접 입력해 주세요.");
        return false;
      }
      return true;
    }

      });

    function driverActions(o) {
      if (o.status === "담당") return `<button onclick="pickupFlagForOrder('${o.id}')">배송중</button>`;
      if (o.status === "배송중") return `<button class="green" onclick="openCompleteModal('${o.id}')">설치완료</button>`;
      if (o.status === "설치완료" && !o.recoveryStaffId && isOrderRecoveryDue(o)) return `<button class="amber" onclick="assignRecoveryToMe('${o.id}')">회수배정</button>`;
      if (o.status === "설치완료" && o.recoveryStaffId === session.id) return `<button class="amber" onclick="openRecoverModal('${o.id}')">회수완료</button>`;
      if (o.status === "회수완료") return `<button class="green" onclick="inboundFlag('${o.id}')">입고등록</button>`;
      return `<button class="secondary" onclick="openOrderDetail('${o.id}')">보기</button>`;
    }

    function pickupFlagForOrder(id) {
      const order = orderById(id);
      const item = assignedFlag(order || {});
      if (!order) return;
      if (!item) {
        alert("11. 주문배정 화면에서 고객사 깃발을 먼저 사전 배정해 주세요.");
        return;
      }
      if (item.status === "site" && !isFlagRecoverable(item)) {
        alert(`현장 설치 깃발은 회수 가능 시기 이후 출고할 수 있습니다.\n회수 가능: ${fmtSheetDateTime(flagAvailableAt(item))}`);
        return;
      }
      if (item.status === "site") {
        const sourceOrder = orderById(item.siteOrderId);
        if (sourceOrder && sourceOrder.status === "설치완료") {
          sourceOrder.status = "회수완료";
          sourceOrder.recoveredAt = new Date().toISOString();
          sourceOrder.recoveryStaffId = session.id;
          sourceOrder.photos = sourceOrder.photos || {};
          sourceOrder.photos.recovery = sourceOrder.photos.recovery || "현장 인계 처리";
        }
      }
      const holderStaffId = session.role === "driver" ? session.id : order.staffId;
      if (!holderStaffId) {
        alert("담당 기사가 배정되어 있어야 배송중으로 변경할 수 있습니다.");
        return;
      }
      item.status = "driver";
      item.holderStaffId = holderStaffId;
      item.siteOrderId = "";
      item.locationMemo = `${staffName(holderStaffId)} 기사님 보유`;
      item.updatedAt = new Date().toISOString();
      order.status = "배송중";
      audit("깃발출고", "출고", `${order.no} ${item.label || item.id} 인계 확인`);
      save();
      closeModal();
      render();
    }

    function isOrderRecoveryDue(order) {
      const at = order.recoveryDue || order.burialAt || order.eventEnd || "";
      return !at || new Date(at) <= new Date();
    }

    function assignRecoveryToMe(id) {
      const order = orderById(id);
      if (!order) return;
      if (!isOrderRecoveryDue(order)) {
        alert(`아직 회수 가능 시간이 아닙니다.\n회수 가능: ${fmtSheetDateTime(order.recoveryDue || order.burialAt || order.eventEnd)}`);
        return;
      }
      const recoveryStaffId = session.role === "driver" ? session.id : order.staffId;
      if (!recoveryStaffId) {
        alert("회수 담당 기사를 배정할 수 없습니다. 담당 기사를 먼저 확인해 주세요.");
        return;
      }
      order.recoveryStaffId = recoveryStaffId;
      audit("회수배정", "배정", `${order.no} ${staffName(recoveryStaffId)} 회수 배정`);
      save();
      closeModal();
      render();
