            ${flagStatusTable()}
          </div>
        </div>`;
    }

    function flagInputBlock(label, prefix, item = {}) {
      const initial = Number(item.initial || 0);
      const added = Number(item.added || 0);
      const damaged = Number(item.damaged || 0);
      const operating = Math.max(0, initial + added - damaged);
      return `
        <div class="client-form-box" style="box-shadow:none; background:#f7f5f1">
          <div class="topbar"><h3>${label}</h3><b class="badge blue">운용 수량 ${operating}개</b></div>
          <div class="grid cols-3">
            <label>초기 제작<input name="${prefix}Initial" type="number" min="0" value="${initial}" oninput="updateFlagOperatingPreview()"></label>
            <label>추가 제작<input name="${prefix}Added" type="number" min="0" value="${added}" oninput="updateFlagOperatingPreview()"></label>
            <label>파손 처리<input name="${prefix}Damaged" type="number" min="0" value="${damaged}" oninput="updateFlagOperatingPreview()"></label>
          </div>
        </div>`;
    }

    function flagInventory(clientId, type) {
      if (!clientId) return {};
      return (state.inventories || []).find(item => item.clientId === clientId && item.type === type) || {};
    }

    function flagRows() {
      return state.clients
        .map(client => ({
          client,
          funeral: flagInventory(client.id, "funeral"),
          celebration: flagInventory(client.id, "celebration")
        }))
        .filter(row => row.funeral.id || row.celebration.id);
    }

    function flagTotal(item, key) {
      return Number(item?.[key] || 0);
    }

    function flagOperating(item) {
      return Math.max(0, flagTotal(item, "initial") + flagTotal(item, "added") - flagTotal(item, "damaged"));
    }

    function flagStatusTable() {
      const rows = flagRows();
      const renderedRows = rows.map(row => flagStatusRow(row));
      return `<div class="table-wrap status-table"><table>
        <thead>
          <tr>
            <th rowspan="2" style="background:var(--nav); color:#fff">고객사</th>
            <th colspan="3" style="background:#3b76ad; color:#fff; text-align:center">초기 제작</th>
            <th colspan="3" style="background:#438f5a; color:#fff; text-align:center">추가 제작</th>
            <th colspan="3" style="background:#c9672a; color:#fff; text-align:center">파손 처리</th>
            <th colspan="3" style="background:#7b7b78; color:#fff; text-align:center">운용 수량</th>
            <th rowspan="2" style="background:var(--nav); color:#fff">관리</th>
          </tr>
          <tr>
            ${["근조기","축하기","총수량","근조기","축하기","총수량","근조기","축하기","총수량","근조기","축하기","총수량"].map(label => `<th>${label}</th>`).join("")}
          </tr>
        </thead>
        <tbody>${renderedRows.join("")}${statusBlankRows(14, renderedRows.length, "등록된 깃발 수량이 없습니다.")}</tbody>
      </table></div>`;
    }

    function flagStatusRow(row) {
      const f = row.funeral;
      const c = row.celebration;
      const initialTotal = flagTotal(f, "initial") + flagTotal(c, "initial");
      const addedTotal = flagTotal(f, "added") + flagTotal(c, "added");
      const damagedTotal = flagTotal(f, "damaged") + flagTotal(c, "damaged");
      const operatingFuneral = flagOperating(f);
      const operatingCelebration = flagOperating(c);
      const operatingTotal = operatingFuneral + operatingCelebration;
      return `<tr onclick="selectFlagClient('${row.client.id}')" style="cursor:pointer">
        <td><b>${escapeHtml(row.client.name)}</b></td>
        <td>${flagTotal(f, "initial")}</td><td>${flagTotal(c, "initial")}</td><td><b>${initialTotal}</b></td>
        <td>${flagTotal(f, "added")}</td><td>${flagTotal(c, "added")}</td><td><b>${addedTotal}</b></td>
        <td>${flagTotal(f, "damaged")}</td><td>${flagTotal(c, "damaged")}</td><td><b>${damagedTotal}</b></td>
        <td>${operatingFuneral}</td><td>${operatingCelebration}</td><td><b>${operatingTotal}</b></td>
        <td><button class="secondary" onclick="event.stopPropagation(); selectFlagClient('${row.client.id}')">수정</button> <button class="red" onclick="event.stopPropagation(); deleteFlagFromPanel('${row.client.id}')">삭제</button></td>
      </tr>`;
    }

    function selectFlagClient(clientId) {
      editingFlagClientId = clientId;
      render();
    }

    function clearFlagForm() {
      editingFlagClientId = "";
      render();
    }

    function updateFlagOperatingPreview() {
      // The preview is recalculated on render after save or selection.
    }

    function saveFlagFromPanel(event) {
      event.preventDefault();
      const data = Object.fromEntries(new FormData(event.target).entries());
      const clientId = data.clientId;
      const hasRecord = !!(flagInventory(clientId, "funeral").id || flagInventory(clientId, "celebration").id);
      upsertFlagInventory(clientId, "funeral", data.funeralInitial, data.funeralAdded, data.funeralDamaged);
      upsertFlagInventory(clientId, "celebration", data.celebrationInitial, data.celebrationAdded, data.celebrationDamaged);
      syncFlagItemsForInventory(clientId, "funeral");
      syncFlagItemsForInventory(clientId, "celebration");
      editingFlagClientId = "";
      audit("깃발", hasRecord ? "수정" : "등록", `${clientName(clientId)} 깃발 수량 저장`);
      save();
      render();
    }

    function upsertFlagInventory(clientId, type, initial, added, damaged) {
      state.inventories = state.inventories || [];
      let item = state.inventories.find(row => row.clientId === clientId && row.type === type);
      if (!item) {
        item = { id: uid(), clientId, type, initial: 0, added: 0, damaged: 0, stored: 0, inUse: 0 };
        state.inventories.push(item);
      }
      item.initial = Number(initial || 0);
      item.added = Number(added || 0);
      item.damaged = Number(damaged || 0);
      item.stored = flagOperating(item);
      item.inUse = 0;
    }

    function syncFlagItemsForInventory(clientId, type) {
      state.flagItems = state.flagItems || [];
      const inventory = flagInventory(clientId, type);
      const target = flagOperating(inventory);
      let items = state.flagItems.filter(item => item.clientId === clientId && item.type === type);
      while (items.length < target) {
        const nextIndex = items.length + 1;
        const item = {
          id: uid(),
          clientId,
          type,
          label: `${orderTypes[type] || type}-${String(nextIndex).padStart(2, "0")}`,
          status: "office",
          holderStaffId: "",
          siteOrderId: "",
          assignedOrderId: "",
          locationMemo: "사무실",
          updatedAt: new Date().toISOString()
        };
        state.flagItems.push(item);
        items.push(item);
      }
      while (items.length > target) {
        const removable = [...items].reverse().find(item => item.status === "office" && !item.assignedOrderId);
        if (!removable) break;
        state.flagItems = state.flagItems.filter(item => item.id !== removable.id);
        items = items.filter(item => item.id !== removable.id);
      }
    }

    function deleteFlagFromPanel(clientId) {
      if (!confirm("삭제하시겠습니까?")) return;
      state.inventories = (state.inventories || []).filter(item => item.clientId !== clientId);
      state.flagItems = (state.flagItems || []).filter(item => item.clientId !== clientId || item.assignedOrderId || item.status !== "office");
      audit("깃발", "삭제", `${clientName(clientId)} 깃발 수량 삭제`);
      if (editingFlagClientId === clientId) editingFlagClientId = "";
      save();
      render();
    }

    function planDefaults(type) {
      return [
        { region: "광주광역시", detail: "광주 전 지역", price: type === "funeral" ? 16000 : 20000 },
        { region: "광주근교", detail: "화순, 담양, 나주, 장성", price: 40000 },
        { region: "전남북근교", detail: "영광, 함평, 곡성, 보성, 영암, 무안, 목포", price: 50000 },
        { region: "그 외 지역", detail: "위 지역을 제외한 전남 및 기타", price: 60000 }
      ];
    }

    function planBaseRows() {
      return planDefaults("funeral").map((row, index) => ({
        region: row.region,
        detail: row.detail,
        funeralPrice: row.price,
        celebrationPrice: planDefaults("celebration")[index].price
      }));
    }

    function renderPlanAdmin() {
      const clientId = editingPlanClientId || "";
      const registeredClientCount = planClientIds().length;
      return `
        <div class="plan-screen">
          <div class="plan-top-grid">
            <form class="client-form-box plan-input-box" onsubmit="savePlanFromPanel(event)">
              <div class="topbar">
                <div><h3>고객사별 요금제 입력</h3></div>
                <div class="actions"><span class="hint">(VAT포함)</span>${clientId ? `<button type="button" class="secondary" onclick="clearPlanForm()">신규 입력</button>` : ""}</div>
              </div>
              <label class="single-line-field"><span>고객사</span>
                <select name="clientId" required onchange="editingPlanClientId=this.value; render()">
                  <option value="">등록된 고객사 선택</option>
                  ${state.clients.map(client => `<option value="${client.id}" ${client.id === clientId ? "selected" : ""}>${escapeHtml(client.name)}</option>`).join("")}
                </select>
              </label>
              ${planRateTable(clientId)}
              <button>저장</button>
            </form>
            <div class="client-form-box plan-change-box">
              <h3 style="margin:0 0 10px">변경 내역 (${(state.planChanges || []).length})</h3>
              ${planChangeTable()}
            </div>
          </div>
          <div class="client-form-box plan-status-box">
            <h3 style="margin:0 0 10px">등록된 요금제 현황 (${registeredClientCount})</h3>
            ${planStatusTable()}
          </div>
        </div>`;
    }

    function planRateTable(clientId) {
      const rows = planBaseRows().map(base => {
        const funeral = (state.plans || []).find(plan => plan.clientId === clientId && plan.type === "funeral" && plan.region === base.region);
        const celebration = (state.plans || []).find(plan => plan.clientId === clientId && plan.type === "celebration" && plan.region === base.region);
        return {
          ...base,
          detail: funeral?.detail || celebration?.detail || base.detail,
          funeralPrice: funeral?.price ?? base.funeralPrice,
          celebrationPrice: celebration?.price ?? base.celebrationPrice
        };
      });
      return `<div class="rate-input-table">
        <div class="table-wrap">
          <table>
            <thead><tr><th>지역 구분</th><th>상세 지역</th><th>근조기</th><th>축하기</th></tr></thead>
            <tbody>${rows.map((row, index) => `
              <tr>
                <td><input name="plan_${index}_region" value="${escapeHtml(row.region)}" required></td>
                <td><input name="plan_${index}_detail" value="${escapeHtml(row.detail)}" required></td>
                <td><input name="plan_${index}_funeral" type="number" min="0" step="1000" value="${Number(row.funeralPrice || 0)}" required></td>
                <td><input name="plan_${index}_celebration" type="number" min="0" step="1000" value="${Number(row.celebrationPrice || 0)}" required></td>
              </tr>`).join("")}</tbody>
          </table>
        </div>
      </div>`;
    }

    function savePlanFromPanel(event) {
      event.preventDefault();
      const data = Object.fromEntries(new FormData(event.target).entries());
      const clientId = data.clientId;
      const before = planRows().filter(plan => plan.clientId === clientId);
      const newPlans = [];
      for (let index = 0; index < 4; index += 1) {
        const region = String(data[`plan_${index}_region`] || "").trim();
        const detail = String(data[`plan_${index}_detail`] || "").trim();
        const funeralPrice = Number(data[`plan_${index}_funeral`] || 0);
        const celebrationPrice = Number(data[`plan_${index}_celebration`] || 0);
        if (region && detail) {
          newPlans.push({ id: uid(), clientId, type: "funeral", region, detail, price: funeralPrice });
          newPlans.push({ id: uid(), clientId, type: "celebration", region, detail, price: celebrationPrice });
        }
      }
      state.plans = (state.plans || []).filter(plan => plan.clientId && plan.type && plan.region && plan.clientId !== clientId);
      state.plans.push(...newPlans);
      recordPlanChanges(clientId, before, newPlans);
      editingPlanClientId = "";
      audit("요금제", "저장", `${clientName(clientId)} 요금제 저장`);
      save();
      render();
    }

    function planRows() {
      return (state.plans || []).filter(plan => plan.clientId && plan.type && plan.region);
    }

    function planClientIds() {
      const registered = new Set(planRows().map(plan => plan.clientId).filter(Boolean));
      const ordered = (state.clients || []).map(client => client.id).filter(id => registered.has(id));
      const extras = Array.from(registered).filter(id => !ordered.includes(id));
      return ordered.concat(extras);
    }

    function planStatusTable() {
      const clients = planClientIds();
      const regionKeys = ["광주광역시", "광주근교", "전남북근교", "그 외 지역"];
      const short = { "광주광역시": "광주", "광주근교": "광주근교", "전남북근교": "전남인근", "그 외 지역": "그외지역" };
      const priceOf = (clientId, type, region) => {
        const plan = planRows().find(item => item.clientId === clientId && item.type === type && item.region === region);
        return plan ? Number(plan.price || 0).toLocaleString("ko-KR") : "";
      };
      const rows = clients.map((clientId, index) => `<tr class="${editingPlanClientId === clientId ? "selected" : ""}" onclick="selectPlanClient('${clientId}')" style="cursor:pointer">
        <td style="text-align:right">${index + 1}</td>
        <td>${escapeHtml(clientName(clientId))}</td>
        ${regionKeys.map(region => `<td style="text-align:right">${priceOf(clientId, "funeral", region)}</td>`).join("")}
        ${regionKeys.map(region => `<td style="text-align:right">${priceOf(clientId, "celebration", region)}</td>`).join("")}
      </tr>`);
      return `<div class="table-wrap status-table plan-status"><table>
        <thead>
          <tr><th rowspan="2">NO</th><th rowspan="2">고객사</th><th colspan="4">근조기</th><th colspan="4">축하기</th></tr>
          <tr>${regionKeys.map(region => `<th>${short[region]}</th>`).join("")}${regionKeys.map(region => `<th>${short[region]}</th>`).join("")}</tr>
        </thead>
        <tbody>${rows.join("")}${statusBlankRows(10, rows.length, "등록된 요금제가 없습니다.")}</tbody>
      </table></div>`;
    }

    function planPriceMap(rows) {
      const map = {};
      rows.forEach(plan => {
        map[`${plan.type}:${plan.region}`] = Number(plan.price || 0);
      });
      return map;
    }

    function recordPlanChanges(clientId, beforeRows, afterRows) {
      const before = planPriceMap(beforeRows);
      const after = planPriceMap(afterRows);
      const changes = [];
      Object.keys(after).forEach(key => {
        if (before[key] !== after[key]) {
          const [type, region] = key.split(":");
          changes.push({
            id: uid(),
            at: new Date().toISOString(),
            clientId,
            type,
            region,
            before: before[key] ?? "",
            after: after[key],
            actor: currentUserName()
          });
        }
      });
      if (!changes.length) return;
      state.planChanges = (state.planChanges || []).concat(changes).slice(-200);
    }

    function planChangeTable() {
      const rows = [...(state.planChanges || [])].reverse().map(change => `<tr>
        <td>${fmtSheetDateTime(change.at)}</td>
        <td>${escapeHtml(clientName(change.clientId))}</td>
        <td>${escapeHtml(orderTypes[change.type] || change.type)}</td>
        <td>${escapeHtml(change.region || "-")}</td>
        <td style="text-align:right">${change.before === "" ? "-" : Number(change.before || 0).toLocaleString("ko-KR")}</td>
        <td style="text-align:right">${Number(change.after || 0).toLocaleString("ko-KR")}</td>
        <td>${escapeHtml(change.actor || "-")}</td>
      </tr>`);
      return `<div class="table-wrap status-table"><table>
        <thead><tr><th>일시</th><th>고객사</th><th>구분</th><th>지역</th><th>변경전</th><th>변경후</th><th>처리자</th></tr></thead>
        <tbody>${rows.join("")}${statusBlankRows(7, rows.length, "변경 내역이 없습니다.", 10)}</tbody>
      </table></div>`;
    }

    function selectPlanClient(clientId) {
      editingPlanClientId = clientId;
      render();

    function clearPlanForm() {
      editingPlanClientId = "";
      render();
    }

    function deletePlanClient(clientId) {
      if (!confirm("삭제하시겠습니까?")) return;
      state.plans = (state.plans || []).filter(plan => plan.clientId !== clientId);
      if (editingPlanClientId === clientId) editingPlanClientId = "";
      audit("요금제", "삭제", `${clientName(clientId)} 요금제 삭제`);
      save();
      render();

    function adminHeader(label, handler) {
      return `<div class="topbar" style="margin-bottom:12px"><h3>${label}</h3><button onclick="${handler}">추가</button></div>`;
    }

    function simpleTable(rows, cols, kind) {
      const renderedRows = rows.map(r => `<tr>${cols.map(c => `<td>${escapeHtml(r[c])}</td>`).join("")}<td><button class="secondary" onclick="editMaster('${kind}','${r.id}')">수정</button> <button class="red" onclick="deleteMaster('${kind}','${r.id}')">삭제</button></td></tr>`);
      return `<div class="table-wrap status-table"><table><thead><tr>${cols.map(c => `<th>${colName(c)}</th>`).join("")}<th>처리</th></tr></thead><tbody>

    function renderLogs() {
      return `<div class="topbar"><h1>변경 / 알림 로그</h1></div><section class="grid cols-2"><div class="panel"><h3>변경이력(TR)</h3>${logTable(state.audit, "audit")}</div><div class="panel"><h3>문자·카카오톡 알림</h3>${logTable(state.notifications, "notifications")}</div></section>`;
    }

    function logTable(rows, type) {
      if (!rows.length) return `<div class="empty">로그가 없습니다.</div>`;
      const heads = type === "audit" ? ["일시","메뉴","조치","내용","처리자"] : ["일시","채널","수신자","상태","메시지"];

          : `<tr><td>${fmt(r.at)}</td><td>${r.channel}</td><td>${escapeHtml(r.receiver)}</td><td>${r.status}</td><td>${escapeHtml(r.message)}</td></tr>`
        ).join("")}</tbody></table></div>`;
    }

    function openOrderModal() {
      const clientOptions = state.clients.map(c => `<option value="${c.id}" ${session?.role === "client" && session.id === c.id ? "selected" : ""}>${escapeHtml(c.name)}</option>`).join("");

      openModal(`

            <label>호실/홀/룸<select name="room" id="orderRoomSelect">${venueRoomOptions(firstVenueId)}</select></label>

            <label>보유 깃발 재사용<select name="reuse"><option value="true">재사용</option><option value="false">신규/일회성</option></select></label>
          </div>
          <div id="celebrationFields" class="grid cols-3" style="display:none">
            <label>행사명<input name="eventTitle" placeholder="창립기념식"></label>

            <label>행사 종료${dateTimeParts("eventEnd")}</label>

    function updateOrderRoomOptions(venueId, control) {
      const isManual = venueId === "__manual__";
      const root = control?.closest("form") || document;
      const roomSelect = root.querySelector("#orderRoomSelect");
      if (roomSelect) {
        roomSelect.disabled = isManual;
        roomSelect.innerHTML = isManual ? `<option value="">직접 입력 사용</option>` : venueRoomOptions(venueId);
      }
      const manualFields = root.querySelector("#manualVenueFields");
      const manualName = root.querySelector("#manualVenueNameInput");
      const manualRoom = root.querySelector("#manualRoomInput");

    function applyColumnFilter(table, th) {
      const headerText = th.textContent.trim() || "필드";
      const startIndex = th.cellIndex;
      const span = Math.max(1, th.colSpan || 1);
      const previous = th.classList.contains("filter-active") ? (th.dataset.filterValue || "") : "";
      const value = prompt(`${headerText} 필터값을 입력하세요.\n빈 값으로 확인하면 필터가 해제됩니다.`, previous);
      if (value === null) return;
      table.querySelectorAll("th.filter-active").forEach(item => {
        item.classList.remove("filter-active");
        delete item.dataset.filterValue;
      });
      Array.from(table.tBodies[0].rows).forEach(row => {
        row.style.display = "";
      });
      const needle = value.trim().toLowerCase();
      if (!needle) return;
      th.classList.add("filter-active");
      th.dataset.filterValue = value.trim();
      Array.from(table.tBodies[0].rows).forEach(row => {
        const cells = Array.from(row.cells).slice(startIndex, startIndex + span);
        const text = cells.map(cell => cell.textContent).join(" ").toLowerCase();
        row.style.display = text.includes(needle) ? "" : "none";
      });
    }

    async function boot() {
      if (session) state = await fetchState();
      render();
    }

    boot();
  </script>
</body>
</html>
